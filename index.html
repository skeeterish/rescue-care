<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f4f">
<title>Rescue Care</title>
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #1d2420; --muted: #66706a; --line: #dde1dc;
    --accent: #2f6f4f; --accent-text: #ffffff;
    --red: #c0392b; --red-bg: #fdecea; --amber: #b9770e; --amber-bg: #fef5e1;
    --blue: #2e6da4; --green: #3d8b5f; --green-bg: #e8f4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141816; --card: #1e2421; --text: #e8ece9; --muted: #9aa49e; --line: #2f3833;
      --accent: #5fb386; --accent-text: #0e1511;
      --red: #ff7b6b; --red-bg: #3a1e1b; --amber: #f0b24a; --amber-bg: #38290f;
      --blue: #7db4e6; --green: #6fcf97; --green-bg: #1b2e23;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { max-width: 640px; margin: 0 auto; min-height: 100vh; padding: env(safe-area-inset-top) 12px calc(76px + env(safe-area-inset-bottom)); }
  header { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 0; }
  .hdr-actions { display: flex; gap: 4px; }
  .muted { color: var(--muted); } .small { font-size: 13px; } .center { text-align: center; padding: 24px 0; }
  button { font: inherit; border: 0; border-radius: 10px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
  button.primary { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.ghost { background: transparent; color: var(--muted); padding: 8px 10px; min-height: 36px; font-size: 14px; }
  button:disabled { opacity: .55; }
  input, select, textarea { font: inherit; width: 100%; padding: 11px 12px; margin: 6px 0; border: 1px solid var(--line);
    border-radius: 10px; background: var(--bg); color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .card.clickable { cursor: pointer; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .title { font-weight: 650; }
  h2.section { font-size: 14px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 22px 0 4px; }
  h2.section.overdue { color: var(--red); } h2.section.soon { color: var(--amber); }
  .task { border-left: 6px solid var(--line); }
  .task.overdue { border-left-color: var(--red); } .task.soon { border-left-color: var(--amber); }
  .task.later { border-left-color: var(--blue); } .task.done { border-left-color: var(--green); opacity: .75; }
  .daytabs { display: flex; gap: 6px; margin: 4px 0 8px; }
  .daytabs button { flex: 1; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-weight: 600; min-height: 40px; padding: 8px 6px; }
  .daytabs button.active { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .task.preview { border-left-color: var(--line); opacity: .7; }
  .instr { margin-top: 8px; padding: 8px 10px; background: var(--bg); border-radius: 8px; font-size: 14px; }
  .alert { margin-top: 8px; padding: 8px 10px; background: var(--red-bg); color: var(--red); border-radius: 8px; font-size: 14px; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 13px; background: var(--bg); border: 1px solid var(--line); }
  .chip.warn { background: var(--red-bg); color: var(--red); border-color: transparent; font-weight: 600; }
  .chip.notable { background: var(--amber-bg); color: var(--amber); border-color: transparent; }
  .chip.concerning, .chip.urgent { background: var(--red-bg); color: var(--red); border-color: transparent; }
  .error { color: var(--red); font-size: 14px; min-height: 1em; }
  .login { margin-top: 12vh; } .login h1 { margin: 0 0 4px; }
  nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs button { flex: 1; background: transparent; color: var(--muted); border-radius: 0; min-height: 56px; font-weight: 600; }
  nav.tabs button.active { color: var(--accent); }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { width: 100%; max-width: 640px; background: var(--card); border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); max-height: 90vh; overflow: auto; }
  .sheet .btns { display: flex; gap: 8px; margin-top: 8px; } .sheet .btns button { flex: 1; }
  .toast { position: fixed; left: 12px; right: 12px; bottom: calc(72px + env(safe-area-inset-bottom)); max-width: 616px; margin: 0 auto;
    background: var(--text); color: var(--bg); padding: 12px 14px; border-radius: 10px; z-index: 20; }
  .toast.err { background: var(--red); color: #fff; }
  dl { margin: 8px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 14px; }
  dt { color: var(--muted); } dd { margin: 0; }
</style>
</head>
<body>
<div id="app"></div>
<noscript>This app needs JavaScript.</noscript>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ---------------------------------------------------------------------
// Settings. The publishable key is designed to be public; the database's
// access rules (RLS) are what protect the data. NEVER put the service_role
// or "secret" key in this file.
// ---------------------------------------------------------------------
const SUPABASE_URL = 'https://vrwkosctkbuppdiisjhp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-HN6NaIybL85vhWwHP9ksA_2hpywK1p';

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $app = document.getElementById('app');
const state = { me: null, rescue: null, tz: 'America/Denver', people: {}, tab: 'tasks', dayOffset: 0, reload: null, timer: null, $view: null };

const EDIT_WINDOW_MIN = 15;   // volunteers can edit their own entries for this long (the database enforces it)

const OUTCOMES = [
  { value: 'Done',        label: 'Done',                      status: 'Completed' },
  { value: 'Refused',     label: 'Refused / wouldn\'t',       status: 'Completed' },
  { value: 'Partly done', label: 'Partly done',               status: 'Completed' },
  { value: 'Skipped',     label: 'Skipped / couldn\'t do it', status: 'Skipped' },
];

// ---------- small helpers ----------
// Builds page elements. Text is always inserted as plain text, never as HTML.
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(typeof kid === 'object' ? kid : String(kid));
  }
  return el;
}
const localDate = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: state.tz, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(d));
const fmtTime = (d) => new Intl.DateTimeFormat('en-US', { timeZone: state.tz, hour: 'numeric', minute: '2-digit' }).format(new Date(d));
const fmtWhen = (d) => localDate(d) === localDate(new Date())
  ? fmtTime(d)
  : new Intl.DateTimeFormat('en-US', { timeZone: state.tz, month: 'short', day: 'numeric' }).format(new Date(d)) + ' ' + fmtTime(d);

function toast(msg, isError = false) {
  const t = h('div', { class: 'toast' + (isError ? ' err' : '') }, msg);
  document.body.append(t);
  setTimeout(() => t.remove(), isError ? 6000 : 2500);
}
const errorBox = (msg) => h('div', { class: 'card' }, h('p', { class: 'error' }, 'Something went wrong: ' + msg));
const loading = () => h('p', { class: 'muted center' }, 'Loading...');

// ---------- start-up and sign-in ----------
async function start() {
  const { data } = await db.auth.getSession();
  if (data.session) boot(data.session.user); else showLogin();
}

function showLogin() {
  stopTimer();
  const email = h('input', { type: 'email', placeholder: 'Email', autocomplete: 'username', required: true });
  const pw = h('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password', required: true });
  const msg = h('p', { class: 'error' });
  const btn = h('button', { type: 'submit', class: 'primary' }, 'Sign in');
  const form = h('form', { class: 'card login', onsubmit: async (e) => {
    e.preventDefault(); msg.textContent = ''; btn.disabled = true;
    const { data, error } = await db.auth.signInWithPassword({ email: email.value.trim(), password: pw.value });
    btn.disabled = false;
    if (error) { msg.textContent = error.message; return; }
    boot(data.user);
  } }, h('h1', {}, 'Rescue Care'), h('p', { class: 'muted' }, 'Sign in with the account an administrator created for you.'), email, pw, btn, msg);
  $app.replaceChildren(form);
}

async function signOut() {
  stopTimer();
  await db.auth.signOut();
  state.me = null;
  showLogin();
}

function showFatal(message) {
  $app.replaceChildren(h('div', { class: 'card login' }, h('p', {}, message), h('button', { class: 'primary', onclick: signOut }, 'Sign out')));
}

async function boot(user) {
  $app.replaceChildren(loading());
  const mine = await db.from('people').select('id, name, role, rescue_id').eq('auth_user_id', user.id).eq('active', true);
  if (mine.error) return showFatal(mine.error.message);
  if (!mine.data.length) return showFatal('Your login is not linked to a person in a rescue yet. Please ask an administrator.');
  state.me = mine.data[0];
  const [rescue, people] = await Promise.all([
    db.from('rescues').select('id, name, timezone').eq('id', state.me.rescue_id).single(),
    db.from('people').select('id, name').eq('rescue_id', state.me.rescue_id),
  ]);
  if (rescue.error) return showFatal(rescue.error.message);
  state.rescue = rescue.data;
  state.tz = rescue.data.timezone;
  state.people = Object.fromEntries((people.data || []).map((p) => [p.id, p.name]));
  renderShell();
  stopTimer();
  state.timer = setInterval(() => {
    if (state.tab === 'tasks' && !document.querySelector('.overlay')) showTasks();
  }, 60000);
}
function stopTimer() { if (state.timer) clearInterval(state.timer); state.timer = null; }

// ---------- page frame ----------
function renderShell() {
  const tabBtn = (name, label) => h('button', { 'data-tab': name, onclick: () => setTab(name) }, label);
  state.$view = h('main');
  $app.replaceChildren(
    h('header', {},
      h('div', {}, h('strong', {}, state.rescue.name), h('div', { class: 'muted small' }, `${state.me.name} (${state.me.role})`)),
      h('div', { class: 'hdr-actions' },
        h('button', { class: 'ghost', onclick: () => state.reload && state.reload() }, 'Refresh'),
        h('button', { class: 'ghost', onclick: signOut }, 'Sign out'))),
    state.$view,
    h('nav', { class: 'tabs' }, tabBtn('tasks', 'Tasks'), tabBtn('animals', 'Animals')));
  setTab(state.tab);
}
function setTab(name) {
  if (name === 'tasks' && state.tab !== 'tasks') state.dayOffset = 0;
  state.tab = name;
  document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  state.$view.replaceChildren(loading());
  if (name === 'tasks') showTasks(); else showAnimals();
}

// ---------- tasks ----------
const dayShift = (dateStr, n) => {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10);
};

function dayTabs(today) {
  const weekday = new Intl.DateTimeFormat('en-US', { weekday: 'long', timeZone: 'UTC' }).format(new Date(dayShift(today, 2) + 'T12:00:00Z'));
  return h('div', { class: 'daytabs' }, ['Today', 'Tomorrow', weekday].map((label, i) =>
    h('button', { class: i === state.dayOffset ? 'active' : '', onclick: () => { state.dayOffset = i; state.$view.replaceChildren(loading()); showTasks(); } }, label)));
}

async function showTasks() {
  state.reload = showTasks;
  const from = new Date(Date.now() - 36 * 3600e3).toISOString();
  const to = new Date(Date.now() + 96 * 3600e3).toISOString();
  const { data, error } = await db.from('task_list').select('*').gte('scheduled_at', from).lte('scheduled_at', to).order('scheduled_at');
  if (state.tab !== 'tasks') return;
  const v = state.$view;
  if (error) return v.replaceChildren(errorBox(error.message));

  const now = new Date();
  const today = localDate(now);
  const tabs = dayTabs(today);
  const live = data.filter((o) => o.status !== 'Not Applicable');   // cancelled tasks are hidden

  // Tomorrow and the day after: a read-only preview. They can still change until they come due.
  if (state.dayOffset > 0) {
    const target = dayShift(today, state.dayOffset);
    const rows = live.filter((o) => localDate(o.scheduled_at) === target);
    v.replaceChildren(h('div', {},
      tabs,
      h('p', { class: 'muted small' }, 'Preview only. These can change until they come due.'),
      rows.length ? rows.map((o) => taskCard(o, 'preview')) : h('div', { class: 'card' }, 'Nothing scheduled for this day yet.')));
    return;
  }

  const rows = live.filter((o) => localDate(o.scheduled_at) === today || (o.status === 'Scheduled' && new Date(o.scheduled_at) < now));
  const groups = { overdue: [], soon: [], later: [], done: [] };
  for (const o of rows) {
    if (o.status !== 'Scheduled') { groups.done.push(o); continue; }
    const mins = (new Date(o.scheduled_at) - now) / 60000;
    (mins < 0 ? groups.overdue : mins <= 60 ? groups.soon : groups.later).push(o);
  }
  // Log entries for finished tasks, so each can show what was recorded (and offer Edit)
  const entries = {};
  if (groups.done.length) {
    const r = await db.from('care_log').select('*').in('occurrence_id', groups.done.map((o) => o.occurrence_id))
      .eq('status', 'Active').order('logged_at');
    if (state.tab !== 'tasks' || state.dayOffset !== 0) return;
    if (!r.error) for (const e of r.data) entries[e.occurrence_id] = e;   // latest entry wins
  }
  const section = (key, label) => groups[key].length
    ? [h('h2', { class: 'section ' + key }, `${label} (${groups[key].length})`), ...groups[key].map((o) => taskCard(o, key, entries[o.occurrence_id]))]
    : [];

  if (!rows.length) {
    v.replaceChildren(tabs, h('div', { class: 'card' }, h('p', {}, 'No tasks are scheduled for today.'),
      h('p', { class: 'muted small' }, 'If you expected some, ask an administrator to check the assignments.')));
    return;
  }
  v.replaceChildren(tabs, ...section('overdue', 'Overdue'), ...section('soon', 'Due within the hour'),
    ...section('later', 'Later today'), ...section('done', 'Done'));
}

function taskCard(o, kind, entry) {
  const alerts = o.active_alerts ? o.active_alerts.split(' | ') : [];
  const who = o.assigned_to_name ? `Assigned: ${o.assigned_to_name}${o.assigned_to === state.me.id ? ' (you)' : ''}` : 'Unassigned';
  const canEdit = kind === 'done' && entry && (state.me.role === 'Admin' ||
    (entry.completed_by === state.me.id && Date.now() - new Date(entry.logged_at) < EDIT_WINDOW_MIN * 60000));
  const summary = entry ? [entry.outcome,
    entry.detail_value != null ? `${entry.detail_value}${entry.detail_unit ? ' ' + entry.detail_unit : ''}` : null,
    entry.notes].filter(Boolean).join(' \u00B7 ') : null;
  const right = kind === 'done'
    ? (canEdit ? h('button', { class: 'primary', onclick: () => openLogModal(o, entry) }, 'Edit')
               : h('span', { class: 'chip' }, entry ? entry.outcome : o.status))
    : kind === 'preview' ? null
    : h('button', { class: 'primary', onclick: () => openLogModal(o) }, 'Log');
  return h('div', { class: 'card task ' + kind },
    h('div', { class: 'row' },
      h('div', {},
        h('div', { class: 'title' }, o.animal_name ? `${o.task_name}: ${o.animal_name}` : o.task_name),
        h('div', { class: 'muted small' }, [fmtWhen(o.scheduled_at), o.location_name, who].filter(Boolean).join(' \u00B7 '))),
      right),
    o.instruction_snapshot ? h('div', { class: 'instr' }, o.instruction_snapshot) : null,
    summary ? h('div', { class: 'instr' }, summary,
      h('div', { class: 'muted small' }, `Logged by ${state.people[entry.completed_by] || 'unknown'} at ${fmtTime(entry.logged_at)}`)) : null,
    alerts.map((a) => h('div', { class: 'alert' }, '\u26A0 ' + a)));
}

// Log a task (existing = null) or edit a recent entry (existing = the care_log row)
function openLogModal(o, existing = null) {
  const outcome = h('select', {}, OUTCOMES.map((x) => h('option', { value: x.value, selected: !!existing && existing.outcome === x.value }, x.label)));
  const amount = h('input', { type: 'number', step: 'any', inputmode: 'decimal', placeholder: 'Amount (optional)',
    value: existing && existing.detail_value != null ? existing.detail_value : null });
  const unit = h('input', { type: 'text', placeholder: 'Unit, e.g. cups (optional)', value: existing ? existing.detail_unit : null });
  const notes = h('textarea', { rows: 3, placeholder: 'Notes (optional; required if skipped)' }, existing ? existing.notes : null);
  const err = h('p', { class: 'error' });
  const close = () => overlay.remove();
  const save = h('button', { class: 'primary', onclick: async () => {
    err.textContent = '';
    const choice = OUTCOMES.find((x) => x.value === outcome.value);
    if (choice.value === 'Skipped' && !notes.value.trim()) { err.textContent = 'Please add a note explaining why it was skipped.'; return; }
    save.disabled = true;
    const args = {
      p_outcome: choice.value,
      p_detail_value: amount.value === '' ? null : Number(amount.value),
      p_detail_unit: unit.value.trim() || null,
      p_notes: notes.value.trim() || null,
    };
    // One protected database call does everything and checks the rules
    const r = existing
      ? await db.rpc('edit_care_log', { p_log: existing.id, ...args })
      : await db.rpc('log_task', { p_occurrence: o.occurrence_id, ...args });
    if (r.error) { err.textContent = r.error.message; save.disabled = false; return; }
    close(); toast(existing ? 'Updated' : 'Logged'); showTasks();
  } }, existing ? 'Save changes' : 'Save');
  const overlay = h('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) close(); } },
    h('div', { class: 'sheet' },
      h('div', { class: 'title' }, (existing ? 'Edit: ' : '') + (o.animal_name ? `${o.task_name}: ${o.animal_name}` : o.task_name)),
      o.instruction_snapshot ? h('div', { class: 'instr' }, o.instruction_snapshot) : null,
      existing ? h('p', { class: 'muted small' }, 'Changes are recorded in the audit log.') : null,
      outcome, amount, unit, notes, err,
      h('div', { class: 'btns' }, h('button', { onclick: close }, 'Cancel'), save)));
  document.body.append(overlay);
}

// ---------- admin and movement actions ----------
// A simple pop-up form. fields: [{ key, label, type, options, required }]; onSubmit(values) returns an error or null
function openForm({ title, fields, submit, onSubmit }) {
  const makeInput = (f) => {
    if (f.type === 'checks') {   // a row of checkboxes; its value is the checked values joined by commas
      const box = h('div', { class: 'chips' }, f.options.map((o) => h('label', { class: 'chip' },
        h('input', { type: 'checkbox', value: o.value, checked: !!f.checked, style: 'width:auto;margin:0 4px 0 0' }), o.label)));
      Object.defineProperty(box, 'value', { get: () => [...box.querySelectorAll('input:checked')].map((i) => i.value).join(',') });
      return box;
    }
    const el = f.type === 'select' ? h('select', {}, f.options.map((o) => h('option', { value: o.value }, o.label)))
      : f.type === 'textarea' ? h('textarea', { rows: 3 }) : h('input', { type: f.type || 'text' });
    if (f.value != null) el.value = f.value;
    return el;
  };
  const inputs = fields.map((f) => ({ f, el: makeInput(f) }));
  const byKey = Object.fromEntries(inputs.map(({ f, el }) => [f.key, el]));
  for (const { f, el } of inputs) if (f.onchange) { el.addEventListener('change', () => f.onchange(el.value, byKey)); f.onchange(el.value, byKey); }
  const err = h('p', { class: 'error' });
  const close = () => overlay.remove();
  const save = h('button', { class: 'primary', onclick: async () => {
    err.textContent = '';
    const vals = {};
    for (const { f, el } of inputs) {
      const val = el.value.trim();
      if (f.required && !val) { err.textContent = f.label + ' is required.'; return; }
      vals[f.key] = val === '' ? null : val;
    }
    save.disabled = true;
    const error = await onSubmit(vals);
    if (error) { err.textContent = error.message; save.disabled = false; return; }
    close();
  } }, submit || 'Save');
  const overlay = h('div', { class: 'overlay', onclick: (e) => { if (e.target === overlay) close(); } },
    h('div', { class: 'sheet' }, h('div', { class: 'title' }, title),
      inputs.map(({ f, el }) => h('label', { class: 'muted small' }, f.label + (f.required ? ' *' : ''), el)),
      err, h('div', { class: 'btns' }, h('button', { onclick: close }, 'Cancel'), save)));
  document.body.append(overlay);
}

async function locationOptions() {
  const r = await db.from('locations').select('id, name').eq('active', true);
  return (r.data || []).sort((x, y) => x.name.localeCompare(y.name, undefined, { numeric: true })).map((l) => ({ value: l.id, label: l.name }));
}
const peopleOptions = () => [{ value: '', label: '(none)' }, ...Object.entries(state.people).map(([id, name]) => ({ value: id, label: name }))];
const opts = (list) => list.map((x) => ({ value: x, label: x }));
async function reloadAnimal(id) {
  const r = await db.from('animal_current_state').select('*').eq('animal_id', id).single();
  if (!r.error) showAnimal(r.data); else showAnimals();
}

function addAnimalBtn() {
  return h('button', { class: 'primary', style: 'width:100%;margin-top:8px', onclick: async () => {
    const locs = await locationOptions();
    openForm({ title: 'Add an animal', submit: 'Add animal',
      fields: [
        { key: 'name', label: 'Name', required: true }, { key: 'species', label: 'Species (Dog, Cat...)', required: true },
        { key: 'breed', label: 'Breed' }, { key: 'sex', label: 'Sex', type: 'select', options: [{ value: '', label: '(unknown)' }, ...opts(['Male', 'Female', 'Unknown'])] },
        { key: 'dob', label: 'Date of birth', type: 'date' },
        { key: 'location', label: 'Starting location', type: 'select', options: locs, required: true },
        { key: 'status', label: 'Starting status', type: 'select', options: opts(['Intake', 'Quarantine', 'Available']), required: true },
        { key: 'caregiver', label: 'Primary caregiver', type: 'select', options: peopleOptions() },
        { key: 'notes', label: 'Notes', type: 'textarea' }],
      onSubmit: async (v) => {
        const r = await db.rpc('admin_add_animal', { p_name: v.name, p_species: v.species, p_breed: v.breed, p_sex: v.sex, p_dob: v.dob,
          p_location: v.location, p_status: v.status, p_caregiver: v.caregiver, p_notes: v.notes });
        if (!r.error) { toast('Animal added'); showAnimals(); }
        return r.error;
      } });
  } }, '+ Add animal');
}

function animalActions(a) {
  const admin = state.me.role === 'Admin';
  const move = async () => {
    const locs = await locationOptions();
    openForm({ title: `Move ${a.animal_name}`, submit: 'Move',
      fields: [{ key: 'loc', label: 'New location', type: 'select', options: locs, required: true }, { key: 'reason', label: 'Reason (optional)' }],
      onSubmit: async (v) => { const r = await db.rpc('move_animal', { p_animal: a.animal_id, p_location: v.loc, p_reason: v.reason });
        if (!r.error) { toast('Moved'); reloadAnimal(a.animal_id); } return r.error; } });
  };
  const status = (kind, list, label) => () => openForm({ title: `${label}: ${a.animal_name}`, submit: 'Save',
    fields: [{ key: 'status', label: 'New status', type: 'select', options: opts(list), required: true }, { key: 'reason', label: 'Reason (optional)' }],
    onSubmit: async (v) => { const r = await db.rpc('change_status', { p_animal: a.animal_id, p_kind: kind, p_status: v.status, p_reason: v.reason });
      if (!r.error) { toast('Status updated'); reloadAnimal(a.animal_id); } return r.error; } });
  const giveBack = async () => {
    const locs = await locationOptions();
    openForm({ title: `Return ${a.animal_name} to the rescue`, submit: 'Record return',
      fields: [{ key: 'loc', label: 'Where is the animal going?', type: 'select', options: locs, required: true },
        { key: 'reason', label: 'Reason for return', value: 'Returned by adopter', required: true },
        { key: 'copy', label: 'Recurring tasks', type: 'checks', checked: true, options: [{ value: 'copy', label: 'Bring back the previous stay\'s tasks' }] },
        { key: 'notes', label: 'Notes', type: 'textarea' }],
      onSubmit: async (v) => {
        if (!confirm('This ends the current stay and starts a new one. Continue?')) return { message: 'Cancelled.' };
        const r = await db.rpc('return_animal', { p_animal: a.animal_id, p_location: v.loc, p_reason: v.reason, p_notes: v.notes, p_copy_tasks: !!v.copy });
        if (!r.error) { toast('Return recorded'); reloadAnimal(a.animal_id); }
        return r.error;
      } });
  };
  return h('div', { class: 'card' }, h('div', { class: 'title' }, 'Actions'),
    h('div', { class: 'chips' }, h('button', { onclick: move }, 'Move'),
      admin && a.rescue_status === 'Adopted' ? h('button', { class: 'primary', onclick: giveBack }, 'Return to rescue') : null,
      admin ? h('button', { onclick: status('rescue', ['Intake', 'Quarantine', 'Available', 'Adoption Pending', 'Adopted', 'Returned'], 'Rescue status') }, 'Change status') : null,
      admin ? h('button', { onclick: status('medical', ['Evaluation Pending', 'Routine', 'Restricted Activity', 'Needs Follow-up'], 'Medical status') }, 'Medical status') : null));
}

const DAYS = [['1', 'Mon'], ['2', 'Tue'], ['3', 'Wed'], ['4', 'Thu'], ['5', 'Fri'], ['6', 'Sat'], ['7', 'Sun']];
async function getTaskTypes() {
  if (!state.taskTypes) {
    const r = await db.from('task_types').select('id, task_name, category, requires_animal').eq('active', true).order('task_name');
    state.taskTypes = r.data || [];
  }
  return state.taskTypes;
}
const clock = (t) => { const [hh, mm] = t.split(':').map(Number); return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${hh < 12 ? 'AM' : 'PM'}`; };

function recurringCard(a, list, types) {
  const name = (id) => (types.find((t) => t.id === id) || {}).task_name || 'Task';
  const add = () => openForm({ title: `Add a recurring task: ${a.animal_name}`, submit: 'Add task',
    fields: [
      { key: 'type', label: 'Task', type: 'select', required: true, options: types.filter((t) => t.requires_animal).map((t) => ({ value: t.id, label: t.task_name })),
        onchange: (val, els) => { const t = types.find((x) => x.id === val); els.fresh.querySelector('input').checked = !!t && t.category === 'Medical'; } },
      { key: 'who', label: 'Assigned to', type: 'select', options: peopleOptions() },
      { key: 'time', label: 'Time of day', type: 'time', required: true },
      { key: 'time2', label: 'Also at (optional)', type: 'time' }, { key: 'time3', label: 'And at (optional)', type: 'time' }, { key: 'time4', label: 'And at (optional)', type: 'time' },
      { key: 'repeat', label: 'Repeats', type: 'select', options: [{ value: 'daily', label: 'Every day' }, { value: 'days', label: 'Selected days only' }] },
      { key: 'days', label: 'Days (only if "Selected days")', type: 'checks', options: DAYS.map(([value, label]) => ({ value, label })) },
      { key: 'start', label: 'Starts', type: 'date', required: true, value: localDate(new Date()) },
      { key: 'fresh', label: 'If starting today', type: 'checks', options: [{ value: 'day', label: 'Start from beginning of day' }] },
      { key: 'end', label: 'Ends (optional)', type: 'date' },
      { key: 'instr', label: 'Instructions (shown to volunteers)', type: 'textarea' }],
    onSubmit: async (v) => {
      if (v.repeat === 'days' && !v.days) return { message: 'Pick at least one day.' };
      const times = [...new Set([v.time, v.time2, v.time3, v.time4].filter(Boolean))];
      const r = await db.from('task_assignments').insert(times.map((tm) => ({
        rescue_id: state.me.rescue_id, animal_id: a.animal_id, episode_id: a.episode_id, task_type_id: v.type, assigned_to: v.who,
        frequency: v.repeat === 'days' ? 'Weekly' : 'Daily', scheduled_time: tm,
        days_of_week: v.repeat === 'days' ? v.days.split(',').map(Number) : null,
        start_date: v.start, end_date: v.end, instructions: v.instr,
        start_from: !v.fresh && v.start === localDate(new Date()) ? new Date().toISOString() : null })));
      if (!r.error) { toast(times.length > 1 ? 'Tasks added' : 'Task added'); reloadAnimal(a.animal_id); }
      return r.error;
    } });
  const end = async (x) => {
    if (!confirm('End this recurring task? Upcoming occurrences will be cancelled; past ones are kept.')) return;
    const today = localDate(new Date());
    const r = await db.from('task_assignments').update({ active: false, end_date: x.start_date > today ? x.start_date : today }).eq('id', x.id);
    if (r.error) toast(r.error.message, true); else { toast('Task ended'); reloadAnimal(a.animal_id); }
  };
  return h('div', { class: 'card' }, h('div', { class: 'row' }, h('div', { class: 'title' }, 'Recurring tasks'), h('button', { class: 'primary', onclick: add }, '+ Add')),
    list.length ? list.map((x) => h('div', { class: 'instr row' },
      h('div', {}, `${name(x.task_type_id)} \u00B7 ${clock(x.scheduled_time)} \u00B7 ${x.days_of_week ? x.days_of_week.map((d) => DAYS[d - 1][1]).join(', ') : 'Every day'}`,
        h('div', { class: 'muted small' }, [state.people[x.assigned_to] || 'Unassigned', x.instructions].filter(Boolean).join(' \u00B7 '))),
      h('button', { onclick: () => end(x) }, 'End'))) : h('p', { class: 'muted small' }, 'No recurring tasks yet.'));
}

// ---------- animals ----------
async function showAnimals() {
  state.reload = showAnimals;
  const { data, error } = await db.from('animal_current_state').select('*').order('animal_name');
  if (state.tab !== 'animals') return;
  const v = state.$view;
  if (error) return v.replaceChildren(errorBox(error.message));
  const adminAdd = state.me.role === 'Admin' ? [addAnimalBtn()] : [];
  if (!data.length) return v.replaceChildren(...adminAdd, h('div', { class: 'card' }, 'No animals yet.'));
  v.replaceChildren(...adminAdd, ...data.map((a) => h('div', { class: 'card clickable', role: 'button', onclick: () => showAnimal(a) },
    h('div', { class: 'row' }, h('span', { class: 'title' }, a.animal_name),
      a.active_alert_count > 0 ? h('span', { class: 'chip warn' }, `\u26A0 ${a.active_alert_count} alert${a.active_alert_count > 1 ? 's' : ''}`) : null),
    h('div', { class: 'chips' }, [a.rescue_status, a.medical_status, a.location_name].filter(Boolean).map((t) => h('span', { class: 'chip' }, t))),
    a.primary_caregiver ? h('div', { class: 'muted small', style: 'margin-top:6px' }, 'Primary caregiver: ' + a.primary_caregiver) : null)));
}

async function showAnimal(a) {
  state.reload = () => showAnimal(a);
  const v = state.$view;
  v.replaceChildren(loading());
  const today = localDate(new Date());
  const isAdmin = state.me.role === 'Admin';
  const [animal, alerts, plans, obs, asg, types] = await Promise.all([
    db.from('animals').select('*').eq('id', a.animal_id).single(),
    db.from('animal_alerts').select('*').eq('animal_id', a.animal_id).eq('status', 'Active').order('created_at', { ascending: false }),
    a.episode_id ? db.from('care_plans').select('*').eq('episode_id', a.episode_id).eq('status', 'Active') : Promise.resolve({ data: [] }),
    db.from('observations').select('*').eq('animal_id', a.animal_id).order('observed_at', { ascending: false }).limit(10),
    isAdmin && a.episode_id ? db.from('task_assignments').select('*').eq('episode_id', a.episode_id).eq('active', true).order('scheduled_time') : Promise.resolve({ data: [] }),
    isAdmin ? getTaskTypes() : Promise.resolve([]),
  ]);
  if (state.tab !== 'animals') return;
  const bad = [animal, alerts, plans, obs, asg].find((r) => r.error);
  if (bad) return v.replaceChildren(backBtn(), errorBox(bad.error.message));

  const an = animal.data;
  const liveAlerts = alerts.data.filter((x) => x.start_date <= today && (!x.expiration_date || x.expiration_date >= today));
  const livePlans = plans.data.filter((p) => p.effective_from <= today && (!p.effective_to || p.effective_to > today));
  const info = [['Species', an.species], ['Breed', an.breed], ['Sex', an.sex], ['Born', an.dob], ['Notes', an.internal_notes]].filter(([, val]) => val);

  const cat = h('select', {}, ['Behavior', 'Appetite', 'Mobility', 'Appearance', 'Pain', 'Other'].map((c) => h('option', { value: c }, c)));
  const sev = h('select', {}, ['Normal', 'Notable', 'Concerning', 'Urgent'].map((c) => h('option', { value: c }, c)));
  const text = h('textarea', { rows: 3, placeholder: 'What did you notice?' });
  const err = h('p', { class: 'error' });
  const add = h('button', { class: 'primary', onclick: async () => {
    err.textContent = '';
    if (!text.value.trim()) { err.textContent = 'Please describe what you noticed.'; return; }
    add.disabled = true;
    const r = await db.from('observations').insert({
      animal_id: a.animal_id, episode_id: a.episode_id, rescue_id: state.me.rescue_id, observed_at: new Date().toISOString(),
      observed_by: state.me.id, category: cat.value, severity: sev.value, observation: text.value.trim(),
    });
    if (r.error) { err.textContent = r.error.message; add.disabled = false; return; }
    toast('Observation saved'); showAnimal(a);
  } }, 'Save observation');

  v.replaceChildren(h('div', {},
    backBtn(),
    h('div', { class: 'card' },
      h('div', { class: 'title', style: 'font-size:20px' }, an.name),
      h('div', { class: 'chips' }, [a.rescue_status, a.medical_status, a.location_name].filter(Boolean).map((t) => h('span', { class: 'chip' }, t))),
      a.primary_caregiver ? h('div', { class: 'muted small', style: 'margin-top:6px' }, 'Primary caregiver: ' + a.primary_caregiver) : null,
      info.length ? h('dl', {}, info.map(([k, val]) => [h('dt', {}, k), h('dd', {}, val)])) : null),
    liveAlerts.length ? [h('h2', { class: 'section overdue' }, 'Alerts'), liveAlerts.map((x) => h('div', { class: 'alert' }, `\u26A0 ${x.alert_text}`))] : null,
    livePlans.length ? [h('h2', { class: 'section' }, 'Current care plans'),
      livePlans.map((p) => h('div', { class: 'card' }, h('span', { class: 'chip' }, p.category), ' ', p.instructions))] : null,
    h('h2', { class: 'section' }, 'Recent observations'),
    obs.data.length ? obs.data.map((x) => h('div', { class: 'card' },
      h('div', { class: 'row' }, h('span', { class: 'muted small' }, `${fmtWhen(x.observed_at)} · ${state.people[x.observed_by] || 'Unknown'} · ${x.category}`),
        h('span', { class: 'chip ' + x.severity.toLowerCase() }, x.severity)),
      h('div', { style: 'margin-top:6px' }, x.observation))) : h('p', { class: 'muted' }, 'None recorded.'),
    a.episode_id ? animalActions(a) : null,
    isAdmin && a.episode_id ? recurringCard(a, asg.data, types) : null,
    a.episode_id ? h('div', { class: 'card' }, h('div', { class: 'title' }, 'Add an observation'), cat, sev, text, err, add)
                 : h('p', { class: 'muted small' }, 'This animal has no current stay, so observations cannot be added.')));
}
const backBtn = () => h('button', { class: 'ghost', onclick: () => showAnimals() }, '\u2190 All animals');

start();
</script>
</body>
</html>
